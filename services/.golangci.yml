# golangci-lint v2 config. Run with `make lint-go` (or `golangci-lint run`
# from this folder); CI runs the same target.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
  settings:
    sloglint:
      # Log through an injected *slog.Logger and pass ctx when one is in
      # scope, so request lines carry trace_id (docs/adr/0004).
      no-global: all
      context: scope

formatters:
  enable:
    - gofmt
    - goimports
