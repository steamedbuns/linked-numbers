# golangci-lint v2 config. Run with `make lint-go` (or `golangci-lint run`
# from this folder); CI runs the same target.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint

formatters:
  enable:
    - gofmt
    - goimports
