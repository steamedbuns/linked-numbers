openapi: 3.1.0
info:
  title: Linked Numbers API
  version: 0.1.0
  description: |
    Source of truth for every REST endpoint. Update it with every endpoint change.
    All calls send `X-User-Id` and `traceparent`; errors use RFC 9457 problem+json.
    Amounts travel as decimal strings, e.g. "1250000.0000".
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8081
    description: values-api (local)
security: []
tags:
  - name: ops
    description: Health probes. Every service serves them on its own port.
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is serving HTTP. It checks no dependencies.
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
  /readyz:
    get:
      tags: [ops]
      operationId: getReadyz
      summary: Readiness probe
      description: >-
        Returns 200 when every readiness check passes, and 503 naming the failed checks otherwise.
        values-api checks `postgres` (a ping) and `schema` (every migration applied).
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "503":
          description: At least one readiness check failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: "not ready: schema: not migrated, want version 1"
components:
  responses:
    Healthy:
      description: The service is healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Problem:
      description: RFC 9457 problem details.
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
