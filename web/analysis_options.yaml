# Checked by `make lint-web` (dart analyze --fatal-infos) locally and in CI.
# Strict: the recommended set, strict type checks, and the extra rules below.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by build_runner; not checked in (docs/adr/0003-web-app-shell.md).
    - "**/*.g.dart"

linter:
  rules:
    # OverReact component factories are PascalCase (`UiFactory<AppProps> App`).
    non_constant_identifier_names: false
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    only_throw_errors: true
    prefer_const_constructors: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_pub_dependencies: true
    type_annotate_public_apis: true
    unawaited_futures: true
